[workspace]
members = [
  "crates/ide-core",
  "crates/workspace",
  "crates/document",
  "crates/filesystem",
  "crates/process",
  "crates/platform",
  "crates/event-bus",
  "crates/command",
  "crates/configuration",
  "crates/language",
  "crates/lsp-client",
  "crates/build",
  "crates/debug",
  "crates/terminal",
  "crates/plugin",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
log = "0.4"
which = "6"
